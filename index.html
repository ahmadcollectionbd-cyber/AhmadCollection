    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />

    <meta property="og:site_name" content="Ahmad Collection" />

    <title>Ahmad Collection — Premium Natural Products in Bangladesh</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ahmad Collection",
        "url": "https://ahmad-collection.vercel.app/",
        "logo": "https://ahmad-collection.vercel.app/logo-192.png",
        "sameAs": [
          "https://web.facebook.com/profile.php?id=100069312635469"
        ],
        "contactPoint": [{
          "@type": "ContactPoint",
          "telephone": "+880-1914-138238",
          "contactType": "customer service",
          "areaServed": "BD",
          "availableLanguage": ["en", "bn"]
        }]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ahmad Collection",
        "url": "https://ahmad-collection.vercel.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ahmad-collection.vercel.app/shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script>
      try {
        const stored = localStorage.getItem('ac-theme');
        if (stored && JSON.parse(stored).state.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>

  </body>
